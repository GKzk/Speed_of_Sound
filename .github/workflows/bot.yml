{
  "name": "bot",
  "on": {
    "workflow_dispatch": null,
    "schedule": [
      {
        "cron": "0 6-20/2 * * *"
      }
    ]
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Checkout Repo",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Setup Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install Reqs",
          "run": "pip install -r requirements.txt"
        },
        {
          "name": "Run Script",
          "env": {
            "BOT_TOKEN": "${{ secrets.BOT_TOKEN }}",
            "CHANNEL_ID": "${{ secrets.CHANNEL_ID }}",
            "AI_API_KEY": "${{ secrets.AI_API_KEY }}",
            "ADMIN_ID": "${{ secrets.ADMIN_ID }}",
            "TZ": "Europe/Moscow"
          },
          "run": "python main.py"
        },
        {
          "name": "Save History",
          "uses": "stefanzweifel/git-auto-commit-action@v5",
          "with": {
            "commit_message": "update history and digest state",
            "file_pattern": "history.json digest_state.txt"
          }
        }
      ]
    }
  }
}
